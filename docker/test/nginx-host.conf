# Test local con --network host (si el puerto publicado no responde): sirve sitio/ como GitHub Pages.
server {
    listen 127.0.0.1:8088;  # red del host: solo loopback, nunca el puerto 80 del equipo
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
