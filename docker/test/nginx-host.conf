# Test local con --network host (si el puerto publicado no responde): sirve sitio/ como GitHub Pages.
server {
    listen 127.0.0.1:8088;  # red del host: solo loopback, nunca el puerto 80 del equipo
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    # Como GitHub Pages: compresión y caché corta (max-age=600), para medir como en producción.
    gzip on;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json text/plain application/xml;
    add_header Cache-Control "max-age=600" always;
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "max-age=600" always;
    }
}
